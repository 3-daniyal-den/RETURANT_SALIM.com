<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E08A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58111A" />
      <stop offset="100%" stop-color="#2E0409" />
    </linearGradient>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="url(#burgundyGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#goldGrad)" stroke-dasharray="2 2" stroke-width="1"/>
    
    <!-- Stylized Crown / Sweet Motif -->
    <path d="M 20 40 L 22 25 L 28 32 L 32 20 L 36 32 L 42 25 L 44 40 Z" fill="url(#goldGrad)"/>
    <circle cx="32" cy="17" r="2" fill="#F7E08A" />
    <circle cx="21" cy="22" r="1.5" fill="#F7E08A" />
    <circle cx="43" cy="22" r="1.5" fill="#F7E08A" />
    
    <!-- Royal Diamond accent -->
    <polygon points="32,43 35,47 32,51 29,47" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <text x="82" y="38" font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="1.5" fill="#F9F6F0">
    SWEET <tspan fill="url(#goldGrad)">SALIM</tspan>
  </text>
  <text x="84" y="56" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="500" letter-spacing="4" fill="#E2C978">
    ROYAL CONFECTIONS &amp; CUISINE
  </text>
  <line x1="84" y1="63" x2="295" y2="63" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
</svg>
